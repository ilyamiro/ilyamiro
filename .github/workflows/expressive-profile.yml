name: Expressive Profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - banner.png
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

env:
  # metawka/expressive-profile (MIT), pinned
  EP_REF: 0dacdd6b4cd8d649b71ace733afbfe1b92649955

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet https://github.com/metawka/expressive-profile.git "$RUNNER_TEMP/ep"
          git -C "$RUNNER_TEMP/ep" checkout --quiet "$EP_REF"
          node "$RUNNER_TEMP/ep/action/render.mjs"

      - name: Add banner
        run: |
          sed -i '1a\
          \
          <img src="banner.png" width="100%" alt="Serpantinum">' README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md .profile
          git diff --cached --quiet || (git commit -m "Updated profile" && git push)
